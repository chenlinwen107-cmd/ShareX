<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShareX - X 图片浏览器</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         "Noto Sans SC", sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: white;
            padding: 22px 18px 16px;
            border-bottom: 1px solid #e5e5e5;
        }

        .logo {
            font-size: 26px;
            font-weight: 700;
        }

        .subtitle {
            margin-top: 5px;
            color: #777;
            font-size: 14px;
        }

        .search-area {
            display: flex;
            gap: 8px;
            margin: 18px;
        }

        .search-input {
            flex: 1;
            min-width: 0;
            padding: 14px 16px;
            border: 1px solid #ddd;
            border-radius: 14px;
            background: white;
            font-size: 15px;
            outline: none;
        }

        .search-input:focus {
            border-color: #999;
        }

        .search-button {
            padding: 0 18px;
            border: none;
            border-radius: 14px;
            background: #222;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        .search-button:active {
            opacity: 0.75;
        }

        main {
            padding: 0 18px 30px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 700;
            margin: 22px 0 14px;
        }

        .empty {
            background: white;
            border-radius: 14px;
            padding: 40px 20px;
            text-align: center;
            color: #888;
        }

        .result {
            display: none;
            margin-top: 14px;
            background: white;
            border-radius: 14px;
            padding: 18px;
            color: #555;
            font-size: 14px;
        }

        footer {
            text-align: center;
            padding: 25px 15px;
            color: #aaa;
            font-size: 12px;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">ShareX</div>
    <div class="subtitle">X 图片内容浏览器</div>
</header>

<div class="search-area">
    <input
        id="searchInput"
        class="search-input"
        type="text"
        placeholder="搜索 X 用户或内容"
    >

    <button
        class="search-button"
        onclick="searchContent()"
    >
        搜索
    </button>
</div>

<main>
    <div class="section-title">推荐</div>

    <div class="empty">
        暂无内容<br>
        <span>ShareX 正在建设中……</span>
    </div>

    <div id="result" class="result"></div>
</main>

<footer>
    ShareX · X 图片内容浏览器
</footer>

<script>
    function searchContent() {
        const input = document.getElementById("searchInput");
        const result = document.getElementById("result");
        const keyword = input.value.trim();

        if (keyword === "") {
            result.style.display = "block";
            result.textContent = "请输入搜索内容";
            return;
        }

        result.style.display = "block";
        result.textContent = "正在搜索：" + keyword;
    }
</script>

</body>
</html>
