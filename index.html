<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShareX - X 图片浏览器</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         "Noto Sans SC", sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: white;
            padding: 22px 18px 16px;
            border-bottom: 1px solid #e5e5e5;
        }

        .logo {
            font-size: 26px;
            font-weight: 700;
        }

        .subtitle {
            margin-top: 5px;
            color: #777;
            font-size: 14px;
        }

        .search-box {
            margin: 18px;
            background: white;
            border-radius: 14px;
            padding: 14px 16px;
            border: 1px solid #ddd;
            color: #999;
            font-size: 15px;
        }

        main {
            padding: 0 18px 30px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 700;
            margin: 22px 0 14px;
        }

        .empty {
            background: white;
            border-radius: 14px;
            padding: 40px 20px;
            text-align: center;
            color: #888;
        }

        footer {
            text-align: center;
            padding: 25px 15px;
            color: #aaa;
            font-size: 12px;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">ShareX</div>
    <div class="subtitle">X 图片内容浏览器</div>
</header>

<div class="search-box">
    🔍 搜索 X 用户或内容
</div>

<main>
    <div class="section-title">推荐</div>

    <div class="empty">
        暂无内容<br>
        <span>ShareX 正在建设中……</span>
    </div>
</main>

<footer>
    ShareX · X 图片内容浏览器
</footer>

</body>
</html>
